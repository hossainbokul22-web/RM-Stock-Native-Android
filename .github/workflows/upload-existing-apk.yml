name: Upload Existing APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-debug.apk'
      - '.github/workflows/upload-existing-apk.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: RM-Stock-APK
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 30
